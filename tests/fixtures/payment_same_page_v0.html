<!doctype html>
<!-- Sanitized loopback-only semantic checkout fixture. No values or session data. -->
<html lang="en">
<head><meta charset="utf-8"><title>Fake Registrar Checkout</title></head>
<body>
  <h1 id="merchant">Fake Registrar</h1>
  <p>example.com domain registration</p>
  <p>Quantity: 1</p>
  <p>Total: 22.00 AUD</p>
  <form id="payment" aria-label="Payment" action="/pay" method="post">
    <label>Card number <input name="account" autocomplete="cc-number"></label>
    <label>Expiration date <input name="expires" autocomplete="cc-exp"></label>
    <label>Security code <input name="verification" autocomplete="cc-csc"></label>
    <label>Name on card <input name="holder" autocomplete="cc-name"></label>
    <button type="submit">Pay now</button>
  </form>
</body>
</html>
